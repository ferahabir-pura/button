<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Survey Form</title>
  </head>

  <body>
    <h1 id="title">freeCodeCamp Survey Form</h1>
    <p id="description">Thank you for taking the time to help us improve the platform</p>
    <form id="survey-form">
      <div>
      <label for="name-label" id="name-label">Name:</label>
      <input id="name"
      name="name-label"
       type="text"
       required
       placeholder="Enter your Name"/>
       </div>
       <div>
      <label for="email-label" id="email-label">Email:</label>
      <input id="email" 
       name="email-label"
       type="email"
       required 
       placeholder="Enter your Email"/>
       </div>
       <div>
       <label for="number" id="number-label">Age (optional):</label>
      <input id="number" 
       name="number"
       type="number" 
       placeholder="Age"
       min="0"
       max="100"/>
       </div>
       <div>
      <label for="dropdown">Which option best describes your current role?</label>
      <select id="dropdown" name="dropdown" >
      <option selected value="current">Select current role</option>
      <option value="student">Student</option>
      <option value="full-timejob">Full time job</option>
      <option value="full-learn">Full time Learner</option>
      <option value="not-say">Prefer not to say</option>
      <option value="other">Other</option>
        </select> 
       </div>
      <label for="recommand">Would you recommend freeCodeCamp to a friend?
      </label>
      <div>
      <label for="def">Definitely</label>
      <input id="def"
      name="recomand"
      type="radio"
      value="def" checked/>
      <label for="maybe">Maybe</label>
      <input id="maybe"
      name="recomand"
      type="radio"
      value="maybe"/>
      <label for="not">Not sure</label>
      <input id="not"
      name="recomand"
      type="radio"
      value="not"/>
      </div>
    <label for="feature">What is your favorite feature of freeCodeCamp?</label>
    <select id="selection" name="selection" >
      <option selected value="option">Select an option</option>
      <option value="challenges">Challenges</option>
      <option value="projects"> Projects</option>
      <option value="community">Community</option>
      <option value="open-source">Open source</option>
      <option value="other">Other</option>
        </select> 
<div>
      <label for="improve">What would you like to see improved? (Check all that apply)</label>
</div>
      <input type="checkbox" id="front-end" name="front-end"
      value="front-end" />
      <label for="front-end">Front-end Projects</label>

      <input type="checkbox" id="back-end" name="back-end"
      value="back-end" />
      <label for="back-end">Back-end Projects</label>

      <input type="checkbox" id="data-visualization" name="data-visualization"
      value="data-visualization" />
      <label for="data-visualization">Data Visualization</label>

      <input type="checkbox" id="challenges" name="challenges"
      value="challenges" />
      <label for="challenges">Challenges</label>

      <input type="checkbox" id="open-source" name="open-source"
      value="open-source" />
      <label for="open-source">Open Source Community</label>

      <input type="checkbox" id="gitter-help-rooms" name="gitter-help-rooms"
      value="gitter-help-rooms" />
      <label for="gitter-help-rooms">Gitter help rooms</label>

      <input type="checkbox" id="video" name="video"
      value="video" />
      <label for="video">Videos</label>

      <input type="checkbox" id="city-meet-ups" name="city-meet-ups"
      value="city-meet-ups" />
      <label for="city-meet-ups">City Meetups</label>

      <input type="checkbox" id="wiki" name="wiki"
      value="wiki" />
      <label for="wiki">Wiki</label>

      <input type="checkbox" id="forum" name="forum"
      value="forum" />
      <label for="forum">Forum</label>

      <input type="checkbox" id="additional-courses" name="additional-courses"
      value="additional-courses" />
      <label for="additional-courses">Additional Courses</label>

      <div>
      <label for="comment">Any comments or suggestions?</label>
      </div>
      <textarea id="comment"
      name="comment"
      placeholder="enter your comment here..." 
      cols="30" rows="10">
      </textarea>
<div>
      <button type="submit" id="submit">Submit</button>
</div>
      </form>
  </body>
</html>
